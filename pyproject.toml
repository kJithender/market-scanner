[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "market-scanner"
version = "0.1.0"
description = "A 6am Pacific, evidence-first US equity watchlist scanner"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "adhabnr-ux" }]
keywords = ["stocks", "scanner", "premarket", "alpaca", "trading"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  # Windows ships no system IANA tz database for zoneinfo.
  'tzdata; sys_platform == "win32"',
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
market-scanner = "market_scanner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/market_scanner"]

[tool.hatch.build]
include = ["src/market_scanner/**/*.py", "src/market_scanner/data/*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
