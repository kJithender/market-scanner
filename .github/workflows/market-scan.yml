name: Market scan

on:
  schedule:
    # Once per trading day. RVOL is computed from a premarket window that closes
    # at 09:29 ET, so a later run re-reports the same relative volume against a
    # drifted price; a second daily scan adds cost without adding signal.
    # GitHub applies the IANA zone, so this holds through PST/PDT changes.
    - cron: "0 6 * * 1-5"
      timezone: "America/Los_Angeles"
  workflow_dispatch:
    inputs:
      provider:
        description: "Market-data provider"
        required: true
        default: "alpaca"
        type: choice
        options:
          - alpaca
          - yahoo
          - demo

permissions:
  contents: read

concurrency:
  group: market-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-scan:
    name: Test and scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Overrides the read-only default: the final step publishes the report to
    # reports/ so it can be pulled locally. Nothing else in the job writes.
    permissions:
      contents: write
    env:
      MARKET_SCANNER_OUTPUT_DIR: artifacts
      PYTHONUNBUFFERED: "1"
      # Manual runs use the chosen input. Scheduled runs use the repository
      # variable SCAN_PROVIDER, falling back to alpaca when it is unset.
      SCAN_PROVIDER: ${{ inputs.provider || vars.SCAN_PROVIDER || 'alpaca' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run tests
        run: |
          ruff check src tests
          python -m pytest --cov=market_scanner --cov-fail-under=80

      - name: Validate required credentials
        if: env.SCAN_PROVIDER == 'alpaca'
        shell: bash
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          missing=0
          for name in APCA_API_KEY_ID APCA_API_SECRET_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required repository secret $name is not configured."
              missing=1
            fi
          done
          exit "$missing"

      - name: Run market scanner
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: market-scanner scan --provider "$SCAN_PROVIDER" --output-dir "$MARKET_SCANNER_OUTPUT_DIR"

      # Renders the watchlist on the run page itself, so it is readable in a
      # browser or the GitHub mobile app without downloading the artifact.
      - name: Publish watchlist to the run summary
        if: always()
        shell: bash
        run: |
          watchlist="$MARKET_SCANNER_OUTPUT_DIR/market-scan.md"
          if [[ -f "$watchlist" ]]; then
            cat "$watchlist" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## No watchlist produced" >> "$GITHUB_STEP_SUMMARY"
            echo "The scan did not write a report. Check the scan step logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload watchlist and run metadata
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: market-scan-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

      # Runs after the upload so a publishing failure can never cost the
      # artifact. Demo output is synthetic and must never be published.
      - name: Publish report to reports/ for local pulls
        if: env.SCAN_PROVIDER != 'demo'
        shell: bash
        run: |
          if ! compgen -G "$MARKET_SCANNER_OUTPUT_DIR/market-scan.*" > /dev/null; then
            echo "No report to publish."
            exit 0
          fi
          mkdir -p reports
          cp "$MARKET_SCANNER_OUTPUT_DIR"/market-scan.* reports/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --staged --quiet; then
            echo "Report unchanged; nothing to commit."
          else
            git commit -m "Publish market scan for $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
